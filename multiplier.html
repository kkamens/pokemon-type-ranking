  function pokeForName(name){
    if (POKE_MAP[name]) return POKE_MAP[name];
    var parts = String(name).split('/');

  }
  function prop(t, padSingle){

  function badgeCell(name){

  }

  /* ---------- 全量表（Excel 式筛选 + 排序） ---------- */
  var ALL = DUALS.concat(SINGLES.map(function(r){
    var p = pokeForName(r.name);

  }));
  for (var ai = 0; ai < DUALS.length; ai++) {
    DUALS[ai].kind = '双';
    DUALS[ai].poke = pokeForName(DUALS[ai].name);
  }
  var SORT = { key: 'total', dir: -1 };
  var TYPE = 'all';
  var SHOW = 'score';
  var Q = '';
  function cmpRows(a, b){
    var k = SORT.key, d = SORT.dir;
    if (k === 'name') return window.comboI18n(a.name).localeCompare(window.comboI18n(b.name), window.APP_LANG) * d;
    if (k === 'kind') return a.kind.localeCompare(b.kind, 'zh') * d;
    if (k === 'poke') {
      var na = a.poke ? a.poke.name : '\uFFFF';

      return window.pokemonI18n(a.poke&&a.poke.id,na).localeCompare(window.pokemonI18n(b.poke&&b.poke.id,nb),window.APP_LANG) * d;
    }
    /* 数值列：主键 + 按 综合、平衡、打击、抗击 依次补次级键 */
    var r = a[k] - b[k];
    if (r !== 0) return r * d;
    var order = ['total', 'bal', 'atk', 'def'];
    for (var i = 0; i < order.length; i++) {
      var k2 = order[i];
      if (k2 === k) continue;
      r = a[k2] - b[k2];

    }
    return 0;

  function updateHead(){

  /* 各数值维度的名次（当前筛选集合内降序，并列同分同名次） */

  function ranksFor(rows, key){
    var sorted = rows.slice().sort(function(a, b){ return b[key] - a[key]; });
    var map = {}, prev = null, r = 0;

  function percentScore(v, key){

              [{ name: (window.APP_LANG==='en'?"Weak on both":window.APP_LANG==='ja'?"\u4e21\u9762\u5f31\u533a":"\u53cc\u5f31\u533a"), coord: [-100, -150], itemStyle: { color: 'rgba(194,85,78,0.065)' }, label: { show: true, position: 'insideBottomLeft', color: '#95605C', fontSize: (window.innerWidth >= 1024 ? 13 : 11) } }, { coord: [0, 0] }]

  document.title=titleMap[lang];

    }
  }
  translateText(document.body);
  var insights={"en":["Across all 17 dual types containing Steel, the mean overall score is <b>232.38</b>, versus 117.78 for other dual types—a gap of <b>114.60</b>. Twelve of the top 20 include Steel, showing a reusable defensive lift rather than a few accidental pairings.","Dual types containing Ground average <b>130.12</b> on offense, the highest of all 18 types; Steel-containing dual types average <b>155.91</b> on defense, also the highest. Ground/Steel combines 140.50 offense with 152.00 defense, ranking second overall while remaining highly balanced.","If a combination is retained only when no other option has both higher offense and higher defense, only <b>Ghost/Steel, Ground/Steel, Ground/Flying, Ground/Rock, and Ice/Ground</b> remain. They form the full efficiency frontier from defensive extreme to offensive extreme.","All 153 dual types score higher overall than the stronger of their two component single types, with an average gain of <b>113.48</b>. Ground/Flying gains the most at 213.50. Offensively, each target uses the better of the two types, creating a coverage union; defensively, weaknesses, resistances, and immunities are recombined.","Across 153 dual types, the correlation between offense and defense is only <b>−0.014</b>, essentially no linear relationship. 127 dual types are non-negative on both axes, and none fall into the double-weak quadrant. Pairing can improve both ends at once.","There are 32 combinations whose offense–defense gap is at most 19, all of them dual types. Normal/Water has a gap of 0 but only 114.00 overall; Ground/Steel has an 11.50 gap and reaches 292.50 overall. Balance measures closeness, not strength."],"ja":["はがねを含む17の複合タイプの総合平均は<b>232.38</b>で、その他の複合タイプ平均117.78を<b>114.60</b>上回ります。総合上位20のうち12がはがねを含み、少数の偶然ではなく再利用可能な耐性向上を示します。","じめんを含む複合タイプの攻撃平均は<b>130.12</b>で18タイプ中最高。はがねを含む複合タイプの耐性平均は<b>155.91</b>で同じく最高です。じめん／はがねは攻撃140.50、耐性152.00で、総合2位かつ高い均衡を持ちます。","他の組み合わせに攻撃と耐性の両方で上回られない条件では、<b>ゴースト／はがね、じめん／はがね、じめん／ひこう、じめん／いわ、こおり／じめん</b>の5つだけが残ります。耐性極振りから攻撃極振りまでの効率境界を構成します。","153の複合タイプはすべて、構成する単タイプのうち強い方より総合点が高く、平均上昇は<b>113.48</b>です。最大はじめん／ひこうの213.50。攻撃側では対象ごとに有利な方を採用して範囲の和集合を作り、耐性側では弱点・耐性・無効を再構成します。","153の複合タイプにおける攻撃と耐性の相関係数は<b>−0.014</b>で、線形関係はほぼありません。127タイプが両軸とも非負で、両方が負の領域には1つもありません。組み合わせにより両面を同時に改善できます。","攻撃と耐性の差が19以内の組み合わせは32あり、すべて複合タイプです。ノーマル／みずは差0でも総合114.00、じめん／はがねは差11.50で総合292.50。バランスは近さを測る指標で、強さそのものではありません。"]}[lang]||[];
  var copies=document.querySelectorAll('.insight-copy');
  for(var c=0;c<copies.length&&c<insights.length;c++) copies[c].innerHTML=insights[c];
  var rules={"en":"<li><b>Multiplier → score</b>: Start with log₂(multiplier), then apply an additional ±0.5 in the same direction for every non-neutral multiplier. This magnifies differences between broader and narrower offensive/defensive coverage.<table class=\"rate\"><thead><tr><th>Multiplier</th><th>Offense</th><th>Defense</th></tr></thead><tbody><tr><td>4×</td><td>+2.5</td><td>−2.5</td></tr><tr><td>2×</td><td>+1.5</td><td>−1.5</td></tr><tr><td>1×</td><td>0</td><td>0</td></tr><tr><td>½×</td><td>−1.5</td><td>+1.5</td></tr><tr><td>¼×</td><td>−2.5</td><td>+2.5</td></tr><tr><td>0×</td><td>−4.5</td><td>+4.5</td></tr></tbody></table></li><li><b>Offense score</b>: Score attacks against all 171 defending type combinations. For a dual attacking combination, use the more favorable of its two types against each target. Use the raw total directly as the offense score on the 171-item scale.</li><li><b>Defense score</b>: Sum scores against attacks from all 18 single types, then multiply by 9.5 (171 ÷ 18) to match the 171-item offensive scale.</li><li><b>Overall</b> = offense + equivalent defense, with equal weight.</li><li><b>Balance</b> = −|offense − equivalent defense|; closer to 0 means more balanced.</li><li><b>0–100 score</b>: Normalize Overall, Balance, Offense, and Defense linearly across all 171 combinations. Filtering does not change the scale; sorting still uses raw scores.</li><li>Ties in the complete table are displayed by comparing Overall → Balance → Offense → Defense in order.</li><li><b>Data source</b>: Types, forms, and base stats use the fixed PokeAPI master-branch snapshot 2fe9553 (2026-10-07, REST API v2, including Pokémon Legends: Z-A data). Matchup multipliers come from the fixed matrix on this page and all values are recalculated by script.</li>","ja":"<li><b>倍率 → スコア</b>：log₂（倍率）を基礎とし、等倍以外は同じ正負方向に±0.5を追加します。これにより、広い／狭い攻撃範囲と耐性範囲の差を強調します。<table class=\"rate\"><thead><tr><th>倍率</th><th>攻撃</th><th>耐性</th></tr></thead><tbody><tr><td>4×</td><td>+2.5</td><td>−2.5</td></tr><tr><td>2×</td><td>+1.5</td><td>−1.5</td></tr><tr><td>1×</td><td>0</td><td>0</td></tr><tr><td>½×</td><td>−1.5</td><td>+1.5</td></tr><tr><td>¼×</td><td>−2.5</td><td>+2.5</td></tr><tr><td>0×</td><td>−4.5</td><td>+4.5</td></tr></tbody></table></li><li><b>攻撃スコア</b>：全171種類の防御側タイプ組み合わせに対して採点します。複合攻撃タイプは、各対象に対して2タイプのうち有利な倍率を採用します。生の合計をそのまま攻撃スコアとし、171項目スケールを維持します。</li><li><b>耐性スコア</b>：18種類の単タイプ攻撃を受けたときのスコアを合計し、9.5（171 ÷ 18）を掛けて171項目の攻撃側スケールに換算します。</li><li><b>総合</b>＝攻撃スコア＋換算耐性スコア。両者は同じ重みです。</li><li><b>バランス</b>＝−|攻撃スコア−換算耐性スコア|。0に近いほど均衡しています。</li><li><b>100点換算</b>：総合・バランス・攻撃・耐性を全171通りで線形正規化し、最低0、最高100とします。フィルターで尺度は変わらず、並べ替えは元スコアを使います。</li><li>全ランキング表で同点の場合、総合 → バランス → 攻撃 → 耐性の順に比較して表示順位を決めます。</li><li><b>データソース</b>：タイプ、フォルム、種族値はPokeAPI master-branch固定スナップショット2fe9553（2026-10-07、REST API v2、『Pokémon LEGENDS Z-A』データを含む）を使用。タイプ相性倍率は本ページの固定行列から計算し、数値はスクリプトで再計算しています。</li>"}[lang]; var ol=document.querySelector('#rules ol'); if(ol&&rules) ol.innerHTML=rules;
  var src=document.querySelector('#rules .src-note'); if(src) src.textContent={"en":"Type icons are cropped from a public third-party asset collection. Each representative Pokémon is the official form with the highest six-stat base-stat total in the fixed snapshot; existing representatives are retained on ties. Nine combinations have no matching Pokémon and display “None”. Images are shown for reference only.","ja":"タイプアイコンは公開されている第三者素材集から切り出したものです。代表ポケモンは固定スナップショット内の全公式フォルムから種族値合計が最大のものを採用し、同値では既存の代表を維持します。該当ポケモンがいない9組は「なし」と表示します。画像は表示上の参照です。"}[lang];
  var q=document.getElementById('q'); if(q) q.placeholder=lang==='en'?'Filter types, e.g. Steel / Ghost…':'タイプを検索（例：はがね / ゴースト）…';
  // Dynamic tables were rendered before this final pass. Translate their type labels too.
  translateText(document.getElementById('starter-tbody')||document.body);
  translateText(document.getElementById('all-tbody')||document.body);
})();
</script>
